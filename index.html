// ── Tax Brackets Calculator (2024-25 ATO rates) ──
function TaxBracketsCalc({netRental}){
  const [salary,setSalary]=useState('');
  const [otherIncome,setOtherIncome]=useState('');
  const [deductions,setDeductions]=useState('');
  const [privateHealth,setPrivateHealth]=useState('yes');
  const [helpDebt,setHelpDebt]=useState('no');

  // 2024-25 Australian resident tax brackets
  const BRACKETS=[
    {min:0,max:18200,rate:0,base:0},
    {min:18201,max:45000,rate:0.16,base:0},
    {min:45001,max:135000,rate:0.30,base:4288},
    {min:135001,max:190000,rate:0.37,base:31288},
    {min:190001,max:Infinity,rate:0.45,base:51638},
  ];

  // Medicare levy
  const MEDICARE_RATE=0.02;
  // Medicare levy surcharge (no private health)
  const MLS_BRACKETS=[
    {min:0,max:93000,rate:0},
    {min:93001,max:108000,rate:0.01},
    {min:108001,max:144000,rate:0.0125},
    {min:144001,max:Infinity,rate:0.015},
  ];

  // HELP repayment rates 2024-25
  const HELP_BRACKETS=[
    {min:0,max:54435,rate:0},
    {min:54436,max:62850,rate:0.01},
    {min:62851,max:66620,rate:0.02},
    {min:66621,max:70618,rate:0.025},
    {min:70619,max:74855,rate:0.03},
    {min:74856,max:79346,rate:0.035},
    {min:79347,max:84107,rate:0.04},
    {min:84108,max:89154,rate:0.045},
    {min:89155,max:94503,rate:0.05},
    {min:94504,max:100174,rate:0.055},
    {min:100175,max:106185,rate:0.06},
    {min:106186,max:112556,rate:0.065},
    {min:112557,max:119309,rate:0.07},
    {min:119310,max:126467,rate:0.075},
    {min:126468,max:134056,rate:0.08},
    {min:134057,max:142100,rate:0.085},
    {min:142101,max:150626,rate:0.09},
    {min:150627,max:159663,rate:0.095},
    {min:159664,max:Infinity,rate:0.10},
  ];

  const sal=parseFloat(salary)||0;
  const other=parseFloat(otherIncome)||0;
  const ded=parseFloat(deductions)||0;
  const rentalComponent=netRental||0;

  const grossIncome=sal+other+rentalComponent;
  const taxableIncome=Math.max(0,grossIncome-ded);

  // Income tax
  const calcTax=(ti)=>{
    if(ti<=0) return 0;
    for(let i=BRACKETS.length-1;i>=0;i--){
      if(ti>=BRACKETS[i].min) return BRACKETS[i].base+(ti-BRACKETS[i].min+1)*BRACKETS[i].rate;
    }
    return 0;
  };
  const incomeTax=Math.round(calcTax(taxableIncome)*100)/100;

  // Tax without rental
  const taxableWithoutRental=Math.max(0,sal+other-ded);
  const taxWithoutRental=Math.round(calcTax(taxableWithoutRental)*100)/100;
  const taxSaving=rentalComponent<0?Math.round((taxWithoutRental-incomeTax)*100)/100:0;

  // Medicare levy
  const medicare=taxableIncome>24276?Math.round(taxableIncome*MEDICARE_RATE*100)/100:0;

  // Medicare levy surcharge
  let mls=0;
  if(privateHealth==='no'&&taxableIncome>93000){
    for(let i=MLS_BRACKETS.length-1;i>=0;i--){
      if(taxableIncome>=MLS_BRACKETS[i].min){mls=Math.round(taxableIncome*MLS_BRACKETS[i].rate*100)/100;break;}
    }
  }

  // HELP repayment
  let helpRepay=0;
  if(helpDebt==='yes'){
    for(let i=HELP_BRACKETS.length-1;i>=0;i--){
      if(taxableIncome>=HELP_BRACKETS[i].min){helpRepay=Math.round(taxableIncome*HELP_BRACKETS[i].rate*100)/100;break;}
    }
  }

  const totalTax=incomeTax+medicare+mls+helpRepay;
  const effectiveRate=taxableIncome>0?Math.round(totalTax/taxableIncome*10000)/100:0;
  const takeHome=grossIncome-totalTax;

  // Bracket breakdown
  const bracketBreakdown=BRACKETS.map((b,i)=>{
    const lo=b.min===0?0:b.min;
    const hi=b.max===Infinity?taxableIncome:Math.min(b.max,taxableIncome);
    if(taxableIncome<lo) return null;
    const taxable=hi-lo+(b.min===0?0:1);
    const tax=taxable*b.rate;
    return {label:b.max===Infinity?`$${lo.toLocaleString()}+`:`$${lo.toLocaleString()} – $${b.max.toLocaleString()}`,rate:`${b.rate*100}%`,taxable,tax};
  }).filter(Boolean);

  return(
    <div>
      <div className="section">
        <h3>🧮 Australian Tax Brackets Calculator — FY 2024-25</h3>
        <div className="ato-info">
          <span className="ato-icon">ℹ️</span>
          <div>Australian resident individual tax rates for the 2024-25 financial year (1 July 2024 – 30 June 2025). Stage 3 tax cuts applied. Net rental income from the property is automatically included.</div>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12,marginBottom:16}}>
          <div className="cgt-input"><label>Salary / Wages ($)</label><input type="number" value={salary} onChange={e=>setSalary(e.target.value)} placeholder="85000" /></div>
          <div className="cgt-input"><label>Other Income ($)</label><input type="number" value={otherIncome} onChange={e=>setOtherIncome(e.target.value)} placeholder="0" /></div>
          <div className="cgt-input"><label>Deductions ($)</label><input type="number" value={deductions} onChange={e=>setDeductions(e.target.value)} placeholder="0" /></div>
          <div className="cgt-input"><label>Private Health Insurance?</label>
            <select value={privateHealth} onChange={e=>setPrivateHealth(e.target.value)}>
              <option value="yes">Yes</option><option value="no">No</option>
            </select>
          </div>
          <div className="cgt-input"><label>HELP / HECS Debt?</label>
            <select value={helpDebt} onChange={e=>setHelpDebt(e.target.value)}>
              <option value="no">No</option><option value="yes">Yes</option>
            </select>
          </div>
          <div className="cgt-input"><label>Net Rental Income (auto)</label>
            <input type="number" value={rentalComponent} readOnly style={{opacity:.7}} />
          </div>
        </div>

        {/* Income summary */}
        <div className="tax-summary">
          <div className="tax-block">
            <h4>Income Breakdown</h4>
            <div className="tx-row"><span>Salary / Wages</span><span className="tv">{fmt(sal)}</span></div>
            <div className="tx-row"><span>Other Income</span><span className="tv">{fmt(other)}</span></div>
            <div className="tx-row"><span>Net Rental Income</span><span className={`tv ${rentalComponent>=0?'pos':'neg'}`}>{fmt(rentalComponent)}</span></div>
            <div className="tx-row"><span>- Deductions</span><span className="tv neg">{fmt(ded)}</span></div>
            <div className="tx-row total"><span>Taxable Income</span><span className="tv">{fmt(taxableIncome)}</span></div>
          </div>

          <div className="tax-block">
            <h4>Tax Payable</h4>
            <div className="tx-row"><span>Income Tax</span><span className="tv neg">{fmt(incomeTax)}</span></div>
            <div className="tx-row"><span>Medicare Levy (2%)</span><span className="tv neg">{fmt(medicare)}</span></div>
            {mls>0&&<div className="tx-row"><span>Medicare Surcharge</span><span className="tv neg">{fmt(mls)}</span></div>}
            {helpRepay>0&&<div className="tx-row"><span>HELP Repayment</span><span className="tv neg">{fmt(helpRepay)}</span></div>}
            <div className="tx-row total"><span>Total Tax</span><span className="tv neg">{fmt(totalTax)}</span></div>
            <div className="tx-row"><span>Effective Tax Rate</span><span className="tv">{effectiveRate}%</span></div>
            <div className="tx-row" style={{fontWeight:600,color:'var(--green)'}}><span>Take-Home (Annual)</span><span className="tv pos">{fmt(takeHome)}</span></div>
            <div className="tx-row" style={{color:'var(--text-sec)'}}><span>Take-Home (Monthly)</span><span className="tv">{fmt(takeHome/12)}</span></div>
            <div className="tx-row" style={{color:'var(--text-sec)'}}><span>Take-Home (Fortnightly)</span><span className="tv">{fmt(takeHome/26)}</span></div>
          </div>
        </div>

        {/* Negative gearing benefit */}
        {taxSaving>0&&(
          <div style={{marginTop:16,padding:16,background:'var(--green-bg)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',textAlign:'center'}}>
            <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.5px',color:'var(--text-dim)'}}>Negative Gearing Tax Benefit</div>
            <div style={{fontSize:28,fontWeight:800,color:'var(--green)',marginTop:4}}>{fmt(taxSaving)}</div>
            <div style={{fontSize:12,color:'var(--text-sec)',marginTop:4}}>Your rental loss of {fmt(Math.abs(rentalComponent))} saves you {fmt(taxSaving)} in tax compared to not having the investment property.</div>
          </div>
        )}

        {/* Bracket breakdown */}
        <div className="section" style={{marginTop:16}}>
          <h3>Tax Bracket Breakdown</h3>
          <table className="tbl">
            <thead><tr><th>Bracket</th><th>Rate</th><th style={{textAlign:'right'}}>Taxable Amount</th><th style={{textAlign:'right'}}>Tax</th></tr></thead>
            <tbody>
              {bracketBreakdown.map((b,i)=>(
                <tr key={i}>
                  <td>{b.label}</td>
                  <td>{b.rate}</td>
                  <td className="amt">{fmt(b.taxable)}</td>
                  <td className="amt neg">{fmt(b.tax)}</td>
                </tr>
              ))}
            </tbody>
            <tfoot><tr style={{fontWeight:700}}><td colSpan={2}>Total Income Tax</td><td></td><td className="amt neg">{fmt(incomeTax)}</td></tr></tfoot>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── Stamp Duty Calculator ──
function StampDutyCalc({prop}){
  const [price,setPrice]=useState(prop?.purchasePrice||'');
  const [state,setState]=useState(prop?.state||'NSW');
  const [purpose,setPurpose]=useState('investment');
  const [firstHome,setFirstHome]=useState('no');
  const [foreign,setForeign]=useState('no');

  const p=parseFloat(price)||0;

  // Stamp duty rates by state (general/investment rates, simplified 2024-25)
  const calcStampDuty=(price,st)=>{
    switch(st){
      case 'NSW':{
        // NSW rates (general)
        if(price<=16000) return price*0.0125;
        if(price<=35000) return 200+(price-16000)*0.015;
        if(price<=93000) return 485+(price-35000)*0.0175;
        if(price<=351000) return 1500+(price-93000)*0.035;
        if(price<=1168000) return 10530+(price-351000)*0.045;
        return 47295+(price-1168000)*0.055;
      }
      case 'VIC':{
        // VIC rates (general)
        if(price<=25000) return price*0.014;
        if(price<=130000) return 350+(price-25000)*0.024;
        if(price<=960000) return 2870+(price-130000)*0.06;
        if(price<=2000000) return 52670+(price-960000)*0.055; // changed to 5.5% for this band
        return Math.round(price*0.065); // premium rate
      }
      case 'QLD':{
        // QLD rates
        if(price<=5000) return 0;
        if(price<=75000) return 1050+(price-75000>0?0:(price-5000)*0.015);
        if(price<=540000) return 1050+(price-75000)*0.035;
        if(price<=1000000) return 17325+(price-540000)*0.045;
        return 38025+(price-1000000)*0.0575;
      }
      case 'WA':{
        // WA rates
        if(price<=120000) return price*0.019;
        if(price<=150000) return 2280+(price-120000)*0.0285;
        if(price<=360000) return 3135+(price-150000)*0.038;
        if(price<=725000) return 11115+(price-360000)*0.0475;
        return 28453+(price-725000)*0.0515;
      }
      case 'SA':{
        // SA rates
        if(price<=12000) return price*0.01;
        if(price<=30000) return 120+(price-12000)*0.02;
        if(price<=50000) return 480+(price-30000)*0.03;
        if(price<=100000) return 1080+(price-50000)*0.035;
        if(price<=200000) return 2830+(price-100000)*0.04;
        if(price<=250000) return 6830+(price-200000)*0.045;
        if(price<=300000) return 9080+(price-250000)*0.05;
        if(price<=500000) return 11330+(price-300000)*0.05;
        return 21330+(price-500000)*0.055;
      }
      case 'TAS':{
        // TAS rates
        if(price<=3000) return 50;
        if(price<=25000) return 50+(price-3000)*0.0175;
        if(price<=75000) return 435+(price-25000)*0.025;
        if(price<=200000) return 1685+(price-75000)*0.035;
        if(price<=375000) return 6060+(price-200000)*0.04;
        if(price<=725000) return 13060+(price-375000)*0.0425;
        return 27935+(price-725000)*0.045;
      }
      case 'ACT':{
        // ACT rates (general)
        if(price<=260000) return price*0.006;
        if(price<=300000) return 1560+(price-260000)*0.023;
        if(price<=500000) return 2480+(price-300000)*0.034;
        if(price<=750000) return 9280+(price-500000)*0.041;
        if(price<=1000000) return 19530+(price-750000)*0.0505;
        if(price<=1455000) return 32155+(price-1000000)*0.056;
        return 57635+(price-1455000)*0.0565;
      }
      case 'NT':{
        // NT uses a formula: D = (0.06571441 × V^2) / 1000
        const v=price/1000;
        return Math.round((0.06571441*v*v)*100)/100;
      }
      default: return 0;
    }
  };

  const baseDuty=Math.round(calcStampDuty(p,state)*100)/100;

  // Foreign buyer surcharge
  const FOREIGN_SURCHARGE={NSW:0.08,VIC:0.08,QLD:0.07,WA:0.07,SA:0.07,TAS:0.03,ACT:0,NT:0};
  const foreignSurcharge=foreign==='yes'?Math.round(p*(FOREIGN_SURCHARGE[state]||0)*100)/100:0;

  // VIC investment surcharge (premium property, general already included but noting it)
  // First home buyer concessions (simplified)
  let fhbDiscount=0;
  let fhbNote='';
  if(firstHome==='yes'&&purpose==='owner-occupier'){
    switch(state){
      case 'NSW': if(p<=800000){fhbDiscount=baseDuty;fhbNote='Full exemption for properties up to $800,000 (First Home Buyer Assistance Scheme)';} else if(p<=1000000){fhbDiscount=baseDuty*((1000000-p)/200000);fhbNote='Partial concession for $800,001-$1,000,000';} break;
      case 'VIC': if(p<=600000){fhbDiscount=baseDuty;fhbNote='Full exemption for properties up to $600,000';} else if(p<=750000){fhbDiscount=baseDuty*((750000-p)/150000);fhbNote='Partial concession for $600,001-$750,000';} break;
      case 'QLD': if(p<=500000){fhbDiscount=baseDuty;fhbNote='Full concession for homes up to $500,000 (vacant land $250,000)';} else if(p<=550000){fhbDiscount=baseDuty*((550000-p)/50000);fhbNote='Partial concession for $500,001-$550,000';} break;
      case 'WA': if(p<=430000){fhbDiscount=baseDuty;fhbNote='Full exemption up to $430,000';} else if(p<=530000){fhbDiscount=baseDuty*((530000-p)/100000);fhbNote='Partial concession for $430,001-$530,000';} break;
      case 'SA': fhbNote='No stamp duty concession for FHB in SA (but $15,000 FHOG available)'; break;
      case 'TAS': if(p<=400000){fhbDiscount=Math.min(baseDuty,7000);fhbNote='50% duty discount up to $7,000 for properties up to $400,000';} break;
      case 'ACT': fhbNote='ACT Home Buyer Concession Scheme — full duty waiver for eligible buyers (income test applies)'; if(p<=1000000) fhbDiscount=baseDuty; break;
      case 'NT': if(p<=650000){fhbDiscount=baseDuty;fhbNote='Full stamp duty abolished for FHBs up to $650,000';} break;
    }
  }

  const totalDuty=Math.max(0,baseDuty-fhbDiscount)+foreignSurcharge;
  const dutyPct=p>0?Math.round(totalDuty/p*10000)/100:0;

  return(
    <div>
      <div className="section">
        <h3>🏛️ Stamp Duty Calculator (Transfer Duty)</h3>
        <div className="ato-info">
          <span className="ato-icon">ℹ️</span>
          <div>Stamp duty (transfer duty) is a state/territory tax payable on property purchases. Rates vary by jurisdiction. This is an <strong>estimate only</strong> — consult your conveyancer or state revenue office for exact amounts. Stamp duty is <strong>not tax deductible</strong> but forms part of the property's cost base for CGT.</div>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12,marginBottom:16}}>
          <div className="cgt-input"><label>Property Price ($)</label><input type="number" value={price} onChange={e=>setPrice(e.target.value)} placeholder="650000" /></div>
          <div className="cgt-input"><label>State / Territory</label>
            <select value={state} onChange={e=>setState(e.target.value)}>
              {['NSW','VIC','QLD','WA','SA','TAS','ACT','NT'].map(s=><option key={s}>{s}</option>)}
            </select>
          </div>
          <div className="cgt-input"><label>Purpose</label>
            <select value={purpose} onChange={e=>setPurpose(e.target.value)}>
              <option value="investment">Investment</option>
              <option value="owner-occupier">Owner-Occupier</option>
            </select>
          </div>
          <div className="cgt-input"><label>First Home Buyer?</label>
            <select value={firstHome} onChange={e=>setFirstHome(e.target.value)}>
              <option value="no">No</option><option value="yes">Yes</option>
            </select>
          </div>
          <div className="cgt-input"><label>Foreign Buyer?</label>
            <select value={foreign} onChange={e=>setForeign(e.target.value)}>
              <option value="no">No</option><option value="yes">Yes</option>
            </select>
          </div>
        </div>

        {p>0&&(
          <div className="cgt-result">
            <div className="tx-row"><span>Property Price</span><span className="tv">{fmt(p)}</span></div>
            <div className="tx-row"><span>Base Stamp Duty ({state})</span><span className="tv neg">{fmt(baseDuty)}</span></div>
            {fhbDiscount>0&&<div className="tx-row"><span>First Home Buyer Discount</span><span className="tv pos">- {fmt(fhbDiscount)}</span></div>}
            {foreignSurcharge>0&&<div className="tx-row"><span>Foreign Buyer Surcharge ({(FOREIGN_SURCHARGE[state]*100)}%)</span><span className="tv neg">{fmt(foreignSurcharge)}</span></div>}
            <div className="tx-row total"><span>Total Stamp Duty Payable</span><span className="tv neg">{fmt(totalDuty)}</span></div>
            <div className="tx-row"><span>Duty as % of Price</span><span className="tv">{dutyPct}%</span></div>
            <div className="tx-row" style={{color:'var(--text-sec)'}}><span>Total Purchase Cost (Price + Duty)</span><span className="tv">{fmt(p+totalDuty)}</span></div>
            {fhbNote&&<div style={{marginTop:8,fontSize:12,color:'var(--accent)',fontStyle:'italic'}}>💡 {fhbNote}</div>}
          </div>
        )}

        {/* State comparison */}
        {p>0&&(
          <div className="section" style={{marginTop:16}}>
            <h3>State-by-State Comparison</h3>
            <table className="tbl">
              <thead><tr><th>State</th><th style={{textAlign:'right'}}>Stamp Duty</th><th style={{textAlign:'right'}}>% of Price</th><th style={{textAlign:'right'}}>Total Cost</th></tr></thead>
              <tbody>
                {['NSW','VIC','QLD','WA','SA','TAS','ACT','NT'].map(s=>{
                  const d=Math.round(calcStampDuty(p,s)*100)/100;
                  return(
                    <tr key={s} style={s===state?{background:'var(--accent-light)',fontWeight:600}:{}}>
                      <td>{s}{s===state?' ✓':''}</td>
                      <td className="amt neg">{fmt(d)}</td>
                      <td className="amt">{(d/p*100).toFixed(2)}%</td>
                      <td className="amt">{fmt(p+d)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Land Tax Estimator ──
function LandTaxCalc({prop}){
  const [landValue,setLandValue]=useState('');
  const [state,setState]=useState(prop?.state||'NSW');
  const [owner,setOwner]=useState('individual');
  const [principal,setPrincipal]=useState('no');
  const [totalLandAll,setTotalLandAll]=useState('');

  const lv=parseFloat(landValue)||0;
  const totalLand=parseFloat(totalLandAll)||lv;

  // Land tax rates by state (2024-25, general/investment, not PPR)
  const calcLandTax=(value,st,ownerType)=>{
    // Principal place of residence is exempt
    if(principal==='yes') return {tax:0,note:'Principal place of residence is exempt from land tax in all states.'};

    switch(st){
      case 'NSW':{
        // General: threshold $1,075,000. Tax: $100 + 1.6% over threshold. Premium >$6,571,000: add 2%
        const thresh=ownerType==='trust'?0:1075000;
        if(value<=thresh) return {tax:0,note:`NSW threshold: $${thresh.toLocaleString()}. Land value below threshold.`};
        const premium=6571000;
        if(value<=premium) return {tax:100+(value-thresh)*0.016,note:`General rate: $100 + 1.6% of value over $${thresh.toLocaleString()}`};
        return {tax:100+(premium-thresh)*0.016+(value-premium)*0.02,note:'Premium rate applies above $6,571,000 (additional 2%)'};
      }
      case 'VIC':{
        // General: threshold $50,000 (trusts $25,000)
        const thresh=ownerType==='trust'?25000:50000;
        if(value<=thresh) return {tax:0,note:`VIC threshold: $${thresh.toLocaleString()}.`};
        if(value<=100000) return {tax:(value-thresh)*0.0002*20,note:'$50,001-$100,000: variable rate'};
        if(value<=300000) return {tax:275+(value-100000)*0.002,note:'$100,001-$300,000: 0.2%'};
        if(value<=600000) return {tax:675+(value-300000)*0.005,note:'$300,001-$600,000: 0.5%'};
        if(value<=1000000) return {tax:2175+(value-600000)*0.008,note:'$600,001-$1,000,000: 0.8%'};
        if(value<=1800000) return {tax:5375+(value-1000000)*0.013,note:'$1,000,001-$1,800,000: 1.3%'};
        if(value<=3000000) return {tax:15775+(value-1800000)*0.022,note:'$1,800,001-$3,000,000: 2.2%'};
        return {tax:42175+(value-3000000)*0.025,note:'Over $3,000,000: 2.5%'};
      }
      case 'QLD':{
        // Individual: threshold $600,000
        const thresh=600000;
        if(value<=thresh) return {tax:0,note:'QLD threshold: $600,000 (individuals).'};
        if(value<=1000000) return {tax:(value-thresh)*0.01,note:'$600,001-$1,000,000: 1.0%'};
        if(value<=3000000) return {tax:4000+(value-1000000)*0.0175,note:'$1,000,001-$3,000,000: 1.75%'};
        if(value<=5000000) return {tax:39000+(value-3000000)*0.0125,note:'$3,000,001-$5,000,000: 1.25%'};
        if(value<=10000000) return {tax:64000+(value-5000000)*0.0175,note:'$5,000,001-$10,000,000: 1.75%'};
        return {tax:151500+(value-10000000)*0.0275,note:'Over $10,000,000: 2.75%'};
      }
      case 'WA':{
        const thresh=300000;
        if(value<=thresh) return {tax:0,note:'WA threshold: $300,000.'};
        if(value<=420000) return {tax:300,note:'$300,001-$420,000: flat $300'};
        if(value<=1000000) return {tax:300+(value-420000)*0.0025,note:'$420,001-$1,000,000: 0.25%'};
        if(value<=1800000) return {tax:1750+(value-1000000)*0.009,note:'$1,000,001-$1,800,000: 0.9%'};
        if(value<=5000000) return {tax:8950+(value-1800000)*0.018,note:'$1,800,001-$5,000,000: 1.8%'};
        if(value<=11000000) return {tax:66550+(value-5000000)*0.022,note:'$5,000,001-$11,000,000: 2.2%'};
        return {tax:198550+(value-11000000)*0.027,note:'Over $11,000,000: 2.7%'};
      }
      case 'SA':{
        const thresh=450000;
        if(value<=thresh) return {tax:0,note:'SA threshold: $450,000.'};
        if(value<=767000) return {tax:(value-thresh)*0.005,note:'$450,001-$767,000: 0.5%'};
        if(value<=1000000) return {tax:1585+(value-767000)*0.01,note:'$767,001-$1,000,000: 1.0%'};
        return {tax:3915+(value-1000000)*0.024,note:'Over $1,000,000: 2.4%'};
      }
      case 'TAS':{
        const thresh=100000;
        if(value<=thresh) return {tax:0,note:'TAS threshold: $100,000.'};
        if(value<=250000) return {tax:50+(value-100000)*0.005,note:'$100,001-$250,000: 0.5%'};
        if(value<=350000) return {tax:800+(value-250000)*0.0075,note:'$250,001-$350,000: 0.75%'};
        if(value<=500000) return {tax:1550+(value-350000)*0.01,note:'$350,001-$500,000: 1.0%'};
        if(value<=750000) return {tax:3050+(value-500000)*0.0125,note:'$500,001-$750,000: 1.25%'};
        return {tax:6175+(value-750000)*0.015,note:'Over $750,000: 1.5%'};
      }
      case 'ACT':{
        // ACT uses unimproved land value, progressive rates
        if(value<=150000) return {tax:value*0.0054,note:'Up to $150,000: 0.54%'};
        if(value<=300000) return {tax:810+(value-150000)*0.0064,note:'$150,001-$300,000: 0.64%'};
        if(value<=450000) return {tax:1770+(value-300000)*0.0109,note:'$300,001-$450,000: 1.09%'};
        if(value<=600000) return {tax:3405+(value-450000)*0.0124,note:'$450,001-$600,000: 1.24%'};
        if(value<=750000) return {tax:5265+(value-600000)*0.0156,note:'$600,001-$750,000: 1.56%'};
        return {tax:7605+(value-750000)*0.0198,note:'Over $750,000: 1.98%'};
      }
      case 'NT':{
        return {tax:0,note:'NT does not have land tax.'};
      }
      default: return {tax:0,note:''};
    }
  };

  const result=calcLandTax(totalLand,state,owner);
  const landTax=Math.round(result.tax*100)/100;
  const landTaxPct=lv>0?Math.round(landTax/lv*10000)/100:0;
  const perWeek=landTax>0?Math.round(landTax/52*100)/100:0;

  return(
    <div>
      <div className="section">
        <h3>🗺️ Land Tax Estimator</h3>
        <div className="ato-info">
          <span className="ato-icon">ℹ️</span>
          <div>
            Land tax is an annual state/territory tax based on the <strong>unimproved land value</strong> (not property value).
            Your <strong>principal place of residence is exempt</strong>.
            Land tax is assessed on the <strong>total taxable land</strong> you own in a state — enter all your land holdings to get the correct bracket.
            Land tax paid on investment properties <strong>is tax deductible</strong>.
          </div>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12,marginBottom:16}}>
          <div className="cgt-input"><label>Land Value — This Property ($)</label><input type="number" value={landValue} onChange={e=>setLandValue(e.target.value)} placeholder="350000" /></div>
          <div className="cgt-input"><label>Total Land in {state} ($)</label><input type="number" value={totalLandAll} onChange={e=>setTotalLandAll(e.target.value)} placeholder="Same as above if only one property" /><div style={{fontSize:10,color:'var(--text-dim)',marginTop:2}}>All taxable land owned in this state</div></div>
          <div className="cgt-input"><label>State / Territory</label>
            <select value={state} onChange={e=>setState(e.target.value)}>
              {['NSW','VIC','QLD','WA','SA','TAS','ACT','NT'].map(s=><option key={s}>{s}</option>)}
            </select>
          </div>
          <div className="cgt-input"><label>Owner Type</label>
            <select value={owner} onChange={e=>setOwner(e.target.value)}>
              <option value="individual">Individual</option>
              <option value="trust">Trust / Company</option>
            </select>
          </div>
          <div className="cgt-input"><label>Principal Residence?</label>
            <select value={principal} onChange={e=>setPrincipal(e.target.value)}>
              <option value="no">No (Investment)</option>
              <option value="yes">Yes (PPR — Exempt)</option>
            </select>
          </div>
        </div>

        {lv>0&&(
          <div className="cgt-result">
            <div className="tx-row"><span>This Property Land Value</span><span className="tv">{fmt(lv)}</span></div>
            {totalLand!==lv&&<div className="tx-row"><span>Total Taxable Land in {state}</span><span className="tv">{fmt(totalLand)}</span></div>}
            <div className="tx-row total"><span>Estimated Annual Land Tax</span><span className={`tv ${landTax>0?'neg':''}`}>{fmt(landTax)}</span></div>
            {landTax>0&&(
              <>
                <div className="tx-row"><span>Per Quarter</span><span className="tv">{fmt(landTax/4)}</span></div>
                <div className="tx-row"><span>Per Week</span><span className="tv">{fmt(perWeek)}</span></div>
                <div className="tx-row"><span>Effective Rate</span><span className="tv">{landTaxPct}%</span></div>
              </>
            )}
            <div style={{marginTop:8,fontSize:12,color:'var(--accent)',fontStyle:'italic'}}>💡 {result.note}</div>
            {landTax>0&&<div style={{marginTop:4,fontSize:12,color:'var(--green)'}}>✓ Land tax on investment property is tax deductible — add it to your Expenses tab.</div>}
          </div>
        )}

        {/* State comparison */}
        {lv>0&&principal==='no'&&(
          <div className="section" style={{marginTop:16}}>
            <h3>State-by-State Comparison (Same Land Value)</h3>
            <table className="tbl">
              <thead><tr><th>State</th><th>Threshold</th><th style={{textAlign:'right'}}>Annual Land Tax</th><th style={{textAlign:'right'}}>Per Week</th><th>Note</th></tr></thead>
              <tbody>
                {['NSW','VIC','QLD','WA','SA','TAS','ACT','NT'].map(s=>{
                  const r=calcLandTax(lv,s,owner);
                  const t=Math.round(r.tax*100)/100;
                  const thresholds={NSW:'$1,075,000',VIC:'$50,000',QLD:'$600,000',WA:'$300,000',SA:'$450,000',TAS:'$100,000',ACT:'Nil',NT:'N/A'};
                  return(
                    <tr key={s} style={s===state?{background:'var(--accent-light)',fontWeight:600}:{}}>
                      <td>{s}{s===state?' ✓':''}</td>
                      <td style={{fontSize:12}}>{thresholds[s]}</td>
                      <td className={`amt ${t>0?'neg':''}`}>{t>0?fmt(t):'$0 (exempt)'}</td>
                      <td className="amt">{t>0?fmt(t/52):'—'}</td>
                      <td style={{fontSize:11,color:'var(--text-dim)',maxWidth:200}}>{s==='NT'?'No land tax':'—'}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
